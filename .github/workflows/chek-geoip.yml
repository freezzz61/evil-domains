name: Check GeoIP DAT

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Clone decoder
        run: |
          git clone --depth 1 https://github.com/v2fly/geoip.git /tmp/geoip

      - name: Decode GeoIP DAT
        run: |
          cat > /tmp/geoip-check.json <<EOF
          {
            "input": [
              {
                "type": "v2rayGeoIPDat",
                "action": "add",
                "args": {
                  "uri": "$GITHUB_WORKSPACE/output/evil-domains-geoip.dat",
                  "wantedList": ["telegram"]
                }
              }
            ],
            "output": [
              {
                "type": "text",
                "action": "output",
                "args": {
                  "outputDir": "/tmp/decoded",
                  "outputExtension": ".txt"
                }
              }
            ]
          }
          EOF

          cd /tmp/geoip
          go run . -c /tmp/geoip-check.json

      - name: Verify CIDRs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ipaddress

          def load_networks(path):
              return [
                  ipaddress.ip_network(line.strip())
                  for line in Path(path).read_text().splitlines()
                  if line.strip()
              ]

          def normalize(networks):
              result = set()

              for version in (4, 6):
                  family = [
                      net for net in networks
                      if net.version == version
                  ]
                  result.update(
                      ipaddress.collapse_addresses(family)
                  )

              return result

          expected_raw = load_networks("output/geoip-raw.txt")

          decoded_file = Path("/tmp/decoded/telegram.txt")
          assert decoded_file.exists(), "telegram category missing"

          actual_raw = load_networks(decoded_file)

          expected = normalize(expected_raw)
          actual = normalize(actual_raw)

          print("Original CIDRs:", len(expected_raw))
          print("Decoded CIDRs:", len(actual_raw))
          print("Expected normalized:", len(expected))
          print("Decoded normalized:", len(actual))
          print("Missing:", expected - actual)
          print("Unexpected:", actual - expected)

          assert expected == actual, "CIDR coverage mismatch"

          print("SUCCESS: all Telegram IP ranges verified")
          PY
