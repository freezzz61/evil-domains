      - name: Build geosite.dat
        run: |
          mkdir -p geosite-data
          cp output/geosite-raw.txt geosite-data/evil-domains
          git clone --depth 1 https://github.com/v2fly/domain-list-community.git
          cd domain-list-community
          go run ./ --datapath=../geosite-data
          cp dlc.dat ../output/evil-domains.dat
          cd ..
          rm -rf geosite-data domain-list-community output/geosite-raw.txt

      - name: Build geoip.dat
        run: |
          mkdir -p geoip-data
          cp output/geoip-raw.txt geoip-data/telegram
          
          git clone --depth 1 https://github.com/v2fly/geoip.git
          cd geoip
          
          # Компилируем только список Telegram
          go run ./ --input=text --output=dat --datapath=../geoip-data --outputname=telegram
          cp output/dat/telegram.dat ../output/evil-domains-geoip.dat
          cd ..
          
          rm -rf geoip-data geoip output/geoip-raw.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evil-domains
          path: output/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: rebuild evil-domains ruleset, dat and geoip"
          git pull --rebase origin main
          git push
