name: Build evil-domains

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - "build.py"
      - "sources.json"
      - ".github/workflows/Updater.yml"

permissions:
  contents: write

concurrency:
  group: evil-domains-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install sing-box
        run: |
          set -euo pipefail

          TAG="v1.14.2"
          VER="${TAG#v}"

          curl -fsSL \
            -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"

          tar -xzf /tmp/sing-box.tar.gz -C /tmp

          sudo install -m 755 \
            "/tmp/sing-box-${VER}-linux-amd64/sing-box" \
            /usr/local/bin/sing-box

          sing-box version

      - name: Build lists, databases and comparison reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python build.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evil-domains
          path: output/
          retention-days: 30

      - name: Commit and push changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: rebuild lists, Happ geosite and source comparison"

          git pull --rebase origin main
          git push
