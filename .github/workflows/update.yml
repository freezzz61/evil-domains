name: Build Evil Domains

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          curl -fsSL https://sing-box.app/install.sh | sh

      - name: Build domain ruleset
        run: python build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evil-domains
          path: output/

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --title "Evil Domains — latest build" \
            --notes "Automatically generated domain-only ruleset."

          gh release upload latest output/* --clobber
