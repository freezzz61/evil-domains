name: Build evil-domains

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.py"
      - "sources.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
  run: |
    # Скачиваем стабильную версию напрямую с GitHub Releases, минуя API
    TAG="v1.14.2"
    VER="${TAG#v}"
    curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box-${VER}-linux-amd64.tar.gz"
    tar -xzf /tmp/sing-box.tar.gz -C /tmp
    sudo install -m 755 /tmp/sing-box-${VER}-linux-amd64/sing-box /usr/local/bin/sing-box
    sing-box version

      - name: Build rule-set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evil-domains
          path: output/

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: rebuild evil-domains ruleset"
          git push
